<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment — TinyTeam</title>
  <meta name="description" content="Payment options for TinyTeam. Submit payment proof for verification." />
  <link rel="stylesheet" href="assets/styles/main.css" />

  <style>
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,"Liberation Mono","Courier New", monospace;}
    .status{margin-top:10px;font-size:13px;color:rgba(0,0,0,0.65);display:none;line-height:1.5}
    .status.show{display:block}
    .btn.secondary{background:#fff;color:#111827;border:1px solid rgba(0,0,0,0.12)}
  </style>
</head>

<body>

<header>
  <div>
    <a href="index.html"><strong>TinyTeam Digital Library</strong></a>
    <nav>
      <a href="start.html">Start</a>
      <a href="help/index.html">Help</a>
    </nav>
  </div>
</header>

<main>
<div class="wrap">

<section class="panel">
  <h1>Payment</h1>
  <p class="muted" style="line-height:1.7;">
    Submit your <strong>Order ID</strong>, choose your package, then pay using the QR or link.
    After paying, upload proof so we can verify manually.
  </p>
</section>

<div class="grid2" style="margin-top:18px;">

<!-- LEFT -->
<div>

<div class="panel">
  <h3>Step 1 — Enter Your Order ID</h3>
  <input id="orderIdInput" class="mono" type="text" placeholder="TT-ORD-2026-000123-ABC" />

  <div style="margin-top:12px;">
    <label class="muted small">Package</label>
    <select id="pkgSel">
      <option value="FAM">Family Library (FAM) — $48</option>
      <option value="COMM">Community Library (COMM) — $89</option>
      <option value="ADDON">Photo / Docs Add-On — $49</option>
    </select>
  </div>
</div>

<!-- PAYMENT FORM -->
<div class="panel" style="margin-top:14px;">
<form
  action="https://script.google.com/macros/s/AKfycbz7zW4jMNjAM8f7RQQ1gvqmZQiOlKrwWoMaHyMabVqamb0dLQDTgzoelzmhyPFHfsHSag/exec?key=TT_PRIVATE_2026_01"
  method="POST">

  <input type="hidden" name="formType" value="PAYMENT" />

  <!-- NORMALIZED FIELDS -->
  <input type="hidden" name="OrderID" id="normOrderID">
  <input type="hidden" name="ClientID" id="normClientID">
  <input type="hidden" name="ClientEmail" id="normClientEmail">
  <input type="hidden" name="Package" id="normPackage">
  <input type="hidden" name="PaymentMethod" id="normPaymentMethod">
  <input type="hidden" name="AmountPaidUSD" id="normAmountPaidUSD">
  <input type="hidden" name="ReferenceCode" id="normReferenceCode">
  <input type="hidden" name="ProofLink" id="normProofLink">

  <div class="oidRow">
    <input name="order_id" id="orderIdHidden" type="text" readonly required>
  </div>

  <div class="oidRow">
    <input name="email" id="payerEmail" type="email" placeholder="Your Email (required)" required>
  </div>

  <div class="oidRow">
    <input name="package" id="packageHidden" type="text" readonly>
  </div>

  <div class="oidRow">
    <select name="payment_method" id="paymentMethodSel" required>
      <option value="">Payment Method</option>
      <option>PayPal</option>
      <option>GCash</option>
      <option>Maya</option>
      <option>GoTyme</option>
      <option>PNB</option>
      <option>Bank Transfer</option>
      <option>Other</option>
    </select>
  </div>

  <div class="oidRow">
    <input name="amount_paid" id="amountPaidInput" type="text" placeholder="Amount Paid (optional)">
  </div>

  <div class="oidRow">
    <input name="reference_code" id="referenceCodeInput" type="text" placeholder="Reference Code (optional)">
  </div>

  <div class="oidRow">
    <input name="proof_link" id="proofLinkInput" type="url" placeholder="Proof link (Google Drive)">
  </div>

  <button class="btn" type="submit">Submit Payment Proof</button>
  <div class="status" id="proofStatus">Submitting proof…</div>
</form>
</div>

</div>
</div>
</div>
</main>

<script>
(function(){
  const oidInput = document.getElementById("orderIdInput");
  const oidHidden = document.getElementById("orderIdHidden");
  const pkgSel = document.getElementById("pkgSel");

  function sync(){
    const oid = oidInput.value.trim();
    const pkg = pkgSel.value;

    oidHidden.value = oid;
    document.getElementById("normOrderID").value = oid;
    document.getElementById("normPackage").value = pkg;
    document.getElementById("normClientEmail").value = document.getElementById("payerEmail").value.trim();
    document.getElementById("normPaymentMethod").value = document.getElementById("paymentMethodSel").value;
    document.getElementById("normAmountPaidUSD").value = document.getElementById("amountPaidInput").value.trim();
    document.getElementById("normReferenceCode").value = document.getElementById("referenceCodeInput").value.trim();
    document.getElementById("normProofLink").value = document.getElementById("proofLinkInput").value.trim();
    document.getElementById("normClientID").value = ""; // derived later from ORDERS
  }

  document.querySelectorAll("input,select").forEach(el=>{
    el.addEventListener("input",sync);
    el.addEventListener("change",sync);
  });

  sync();
})();
</script>

</body>
</html>
